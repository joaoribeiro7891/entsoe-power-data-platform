models:
  - name: fact_price
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['area_code', 'datetime_utc', 'resolution_code']
    columns:
      - name: area_code
        data_tests:
          - relationships:               # every area in the fact exists in dim_area
              arguments:
                to: ref('dim_area')
                field: area_code
      - name: datetime_utc
        data_tests:
          - relationships:               # every slot exists in dim_datetime (fails once the data passes its end date)
              arguments:
                to: ref('dim_datetime')
                field: datetime_utc
      - name: price_eur_mwh
        data_tests:
          - not_null
