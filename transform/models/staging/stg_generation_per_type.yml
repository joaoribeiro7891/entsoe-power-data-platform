models:
  - name: stg_generation_per_type
    description: >
      Actual generation per production type for every European area, latest revision only, typed.
      One row per area, time slot, resolution and production type.
    data_tests:                          # tests on the whole model
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['area_code', 'datetime_utc', 'resolution_code', 'production_type']
    columns:
      - name: datetime_utc
        description: Start of the time slot, UTC.
        data_tests:                      # tests on one column
          - not_null
      - name: production_type
        description: ENTSO-E production type (Solar, Wind Onshore, Fossil Gas, ...).
        data_tests:
          - not_null
      - name: resolution_code
        description: Slot length (PT15M, PT30M or PT60M).
        data_tests:
          - accepted_values:
              arguments:
                values: ['PT15M', 'PT30M', 'PT60M']
      - name: actual_generation_mw
        description: Average generation over the slot, MW.
        data_tests:
          - not_null:
              config:
                severity: warn           # some types only report consumption, so an empty value is not always an error
      - name: actual_consumption_mw
        description: Average consumption by the units over the slot, MW (mostly pumped storage pumping). Often empty.
