models:
  - name: stg_total_load
    description: Actual total load for every European area, latest revision only, typed. One row per area, time slot and resolution.
    data_tests:                          # tests on the whole model
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['area_code', 'datetime_utc', 'resolution_code']
    columns:
      - name: datetime_utc
        description: Start of the time slot, UTC.
        data_tests:                      # tests on one column
          - not_null
      - name: resolution_code
        description: Slot length (PT15M, PT30M or PT60M).
        data_tests:
          - accepted_values:
              arguments:
                values: ['PT15M', 'PT30M', 'PT60M']
      - name: total_load_mw
        description: Average load over the slot, MW.
        data_tests:
          - not_null
